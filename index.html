<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kevinwenya - 开发者个人主页">
    <title>Kevinwenya - 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            padding: 60px 40px;
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 30px;
            border: 4px solid #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .bio {
            color: #666;
            font-size: 1em;
            line-height: 1.8;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 2px solid transparent;
        }

        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .link-btn.outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .link-btn.outline:hover {
            background: #667eea;
            color: white;
        }

        .skills {
            text-align: left;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .skills h3 {
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .skill-tag {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #667eea;
            font-weight: 500;
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.9em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .links {
                flex-direction: column;
            }

            .link-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar">👨‍💻</div>
        <h1>Kevinwenya</h1>
        <p class="subtitle">开发者 | 编程爱好者</p>
        
        <p class="bio">
            欢迎来到我的个人主页！这是我在 GitHub 上分享我的项目和想法的地方。
        </p>

        <div class="links">
            <a href="https://github.com/Kevinwenya" class="link-btn">
                <span>🔗</span> GitHub
            </a>
            <a href="mailto:your-email@example.com" class="link-btn outline">
                <span>✉️</span> 联系我
            </a>
        </div>

        <div class="skills">
            <h3>技能</h3>
            <div class="skill-tags">
                <span class="skill-tag">编程</span>
                <span class="skill-tag">Web 开发</span>
                <span class="skill-tag">GitHub</span>
                <span class="skill-tag">开源</span>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 Kevinwenya. 保留所有权利。</p>
        </div>
    </div>
</body>
</html>
